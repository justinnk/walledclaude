http_port 3128

# A leading dot matches the domain itself plus all subdomains.
#   .anthropic.com  -> api.anthropic.com, console.anthropic.com, ...
#   .claude.ai      -> subscription OAuth / token refresh
#   .claude.com     -> docs, code.claude.com, platform.claude.com

# these are allow lists for you to consider. By default, only the
# `anthropic` list is actually enabled, see below.
# Anthropic (required)
acl anthropic dstdomain .anthropic.com .claude.ai .claude.com
# custom (add your custom whitelist here)
# acl custom dstdomain .example.com
# Zotero MCP (example for MCP configuration)
# Start on host using zotero-mcp serve --transport streamable-http --port 8567 --host 172.20.0.1
acl zotero dstdomain api.zotero.org
acl zotero_dst dst 172.20.0.1 # <- change this to the actual docker bridge IP
                              # docker network inspect claude-sandbox | grep -i gateway
acl zotero_port port 8567
# NOTE: `http_access deny !Safe_ports` below rejects any port not in
# Safe_ports (443 by default). To reach a local service like Zotero on another port,
# also add that port to Safe_ports, e.g.: acl Safe_ports port 8567
# Encyclopedia
acl encyclopedia dstdomain .wikipedia.org .wikimedia.org
# Paper repositories & publishers (optional)
acl science dstdomain .acm.org .ieee.org .springer.com .sciencedirect.com .nature.com \
                      .mdpi.com .arxiv.org .biorxiv.org .jmlr.org \
                      .mlr.press .openreview.net .neurips.cc \
                      .dblp.org .semanticscholar.org .doi.org .zenodo.org \
                      api.crossref.org api.openalex.org
# Code & documentation (optional)
acl code dstdomain .github.com .githubusercontent.com .gitlab.com \
                   .readthedocs.io .python.org .stackoverflow.com .stackexchange.com \
                   .julialang.org .julialang.net .pypi.org .files.pythonhosted.org
# Only HTTPS (CONNECT tunnels) on 443. No plain HTTP at all.
acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

# uncomment the additional lines to add some good to have endpoints that
# are generally trustworthy. To expand the list even further, inspect the
# squid log for blocked calls that you may want to allow. Keep in mind that
# the list above also contains websites with user-generated content, which
# is a risk for prompt injection. However, no exfiltration should be possible
# over most domains included here, as they are not controlled by the users.

# standard safety denies 
# never expose the cache manager interface
http_access deny manager
# never let the proxy be aimed at its own loopback or at link-local
http_access deny to_localhost
http_access deny to_linklocal
# only ever reach safe (443) ports, and only via CONNECT tunnels
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT anthropic
#http_access allow CONNECT custom
#http_access allow CONNECT zotero
#http_access allow zotero_dst zotero_port
#http_access allow CONNECT encyclopedia
#http_access allow CONNECT science
#http_access allow CONNECT code
http_access deny all

# forward proxy only, no caching
cache deny all

# View the log with:
#   docker exec claude-egress-proxy tail -f /var/log/squid/access.log
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 2
 
# don't advertise the sandbox to upstream
via off
forwarded_for delete
 
# quieter shutdown, no disk cache dir needed
shutdown_lifetime 1 second
 
